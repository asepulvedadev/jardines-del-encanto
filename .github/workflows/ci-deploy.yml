name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.8'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run build && npm run test:crm:gateway
      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api --frozen ruff check apps/api ops/dev/crm.py
      - name: Verify CRM against isolated PostgreSQL
        run: |
          uv run --project apps/api --frozen python ops/dev/crm.py init
          uv run --project apps/api --frozen python ops/dev/crm.py test
      - run: python3 -m unittest discover -s tests -v
      - name: Build production images
        env:
          RELEASE: ${{ github.sha }}
        run: |
          release_context=$(mktemp -d)
          git archive --format=tar "$RELEASE" > "$release_context/source.tar"
          python3 - "$release_context" <<'PY'
          import os, pathlib, sys, tarfile
          os.umask(0o077)
          root = pathlib.Path(sys.argv[1])
          with tarfile.open(root / 'source.tar') as archive:
              archive.extractall(root / 'source', filter='data')
          # Exercise the private directory permissions of the root-owned VPS gate.
          for folder in (root / 'source/apps/api/app').rglob('*'):
              if folder.is_dir():
                  folder.chmod(0o700)
          PY
          docker build -f "$release_context/source/apps/web/Dockerfile" -t "jardines-web:$RELEASE" "$release_context/source"
          docker build -f "$release_context/source/apps/api/Dockerfile" -t "jardines-api:$RELEASE" "$release_context/source/apps/api"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 384m --pids-limit 128 "jardines-api:$RELEASE" \
            python -c 'import app.main; import app.crm.manage; import app.social.routes'
      - name: Test the complete stack on the ephemeral runner
        env:
          RELEASE: ${{ github.sha }}
        run: |
          sudo mkdir -p /srv/jardines-del-encanto/secrets
          sudo chmod 700 /srv/jardines-del-encanto/secrets
          openssl rand -hex 32 | sudo tee /srv/jardines-del-encanto/secrets/db_password >/dev/null
          sudo chmod 444 /srv/jardines-del-encanto/secrets/db_password
          docker compose -p jardines-ci -f ops/compose.yaml up -d --wait --wait-timeout 90 db
          sudo python3 ops/crm-provision.py --project jardines-ci
          sudo --preserve-env=RELEASE docker compose -p jardines-ci -f ops/crm.compose.yaml run --rm --no-deps migrate
          sudo --preserve-env=RELEASE docker compose -p jardines-ci -f ops/crm.compose.yaml up -d --wait --wait-timeout 150 web api db
          curl --fail --max-time 10 http://127.0.0.1:13400/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13400/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13400/crm)" = 307
          LANDING_BASE_URL=http://127.0.0.1:13400 npm run test:web
      - name: Clean up ephemeral runner only
        if: always()
        env:
          RELEASE: ${{ github.sha }}
        run: docker compose -p jardines-ci -f ops/compose.yaml down --volumes

      - name: Clean up isolated CRM database on ephemeral runner
        if: always()
        run: docker compose -f ops/dev/compose.yaml down --volumes

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: jardines-production
      cancel-in-progress: false
    steps:
      - name: Deploy the verified commit using the constrained SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          keyfile=$(mktemp)
          hostsfile=$(mktemp)
          trap 'rm -f "$keyfile" "$hostsfile"' EXIT
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$keyfile"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$hostsfile"
          ssh -F /dev/null -i "$keyfile" -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o "UserKnownHostsFile=$hostsfile" \
            "jardines-deploy@$VPS_HOST" "deploy $RELEASE"
