[project]
name = "jardines-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    "pwdlib[argon2]>=0.3.1",
    "pypdf>=7.0.1",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
