# Bootstrap only: never accept a registration over plaintext HTTP.
server {
    listen 80;
    server_name jardinesdelencanto.site www.jardinesdelencanto.site;
    access_log off;
    error_log /var/log/nginx/jardines-domain.error.log;
    location /.well-known/acme-challenge/ {
        root /var/www/jardines-acme;
        try_files $uri =404;
    }
    location / {
        return 302 https://jardines.2.24.111.40.sslip.io$request_uri;
    }
}
