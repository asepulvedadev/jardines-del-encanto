# Bootstrap only: obtain the certificate before enabling the HTTPS configuration.
server {
    listen 80;
    server_name jardines.2.24.111.40.sslip.io;
    access_log /var/log/nginx/jardines-preview.access.log;
    error_log /var/log/nginx/jardines-preview.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/jardines-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
