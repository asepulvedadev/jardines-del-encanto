# Project-specific preview. Keep the application port bound to loopback.
# OAuth codes/state must not enter access logs, including same-origin referrers.
log_format jardines_private '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent';
server {
    listen 80;
    server_name jardines.2.24.111.40.sslip.io;
    access_log /var/log/nginx/jardines-preview.access.log jardines_private;
    error_log /var/log/nginx/jardines-preview.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/jardines-acme;
        try_files $uri =404;
    }
    location / { return 301 https://jardines.2.24.111.40.sslip.io$request_uri; }
}

server {
    listen 443 ssl;
    server_name jardines.2.24.111.40.sslip.io;
    ssl_certificate /etc/letsencrypt/live/jardines-preview/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jardines-preview/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/jardines-preview.access.log jardines_private;
    error_log /var/log/nginx/jardines-preview.error.log;
    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Provision this directory for the active worker user before installation.
    # Do not inherit the shared host's potentially incompatible temp ownership.
    proxy_temp_path /var/lib/nginx/jardines-proxy 1 2;

    # OAuth returns to this exact URI. Nginx upstream error messages can include
    # the original request/query even when the access log format is sanitized.
    # Keep API/other-route error logs; discard only CRM document error messages.
    location = /crm {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:13400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:13400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
