# Project-specific preview. Keep the application port bound to loopback.
server {
    listen 80;
    server_name jardines.2.24.111.40.sslip.io;
    access_log /var/log/nginx/jardines-preview.access.log;
    error_log /var/log/nginx/jardines-preview.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/jardines-acme;
        try_files $uri =404;
    }
    location / { return 301 https://jardines.2.24.111.40.sslip.io$request_uri; }
}

server {
    listen 443 ssl;
    server_name jardines.2.24.111.40.sslip.io;
    ssl_certificate /etc/letsencrypt/live/jardines-preview/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jardines-preview/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/jardines-preview.access.log;
    error_log /var/log/nginx/jardines-preview.error.log;
    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:13400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
