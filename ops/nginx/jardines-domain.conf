# Public-domain alias only; retain the existing CRM and provider origin.
map $uri $jardines_domain_robots {
    default "noindex, nofollow";
    / "";
    /lotes-acacias-desde-bogota-soacha "";
    /robots.txt "";
    /sitemap.xml "";
    ~^/media/ "";
}
log_format jardines_domain_private '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                                   '$status $body_bytes_sent';
server {
    listen 80;
    server_name jardinesdelencanto.site www.jardinesdelencanto.site;
    access_log /var/log/nginx/jardines-domain.access.log jardines_domain_private;
    error_log /var/log/nginx/jardines-domain.error.log;
    location /.well-known/acme-challenge/ {
        root /var/www/jardines-acme;
        try_files $uri =404;
    }
    location / { return 308 https://jardinesdelencanto.site$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.jardinesdelencanto.site;
    ssl_certificate /etc/letsencrypt/live/jardines-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jardines-domain/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/jardines-domain.access.log jardines_domain_private;
    return 308 https://jardinesdelencanto.site$request_uri;
}

server {
    listen 443 ssl;
    server_name jardinesdelencanto.site;
    ssl_certificate /etc/letsencrypt/live/jardines-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jardines-domain/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/jardines-domain.access.log jardines_domain_private;
    error_log /var/log/nginx/jardines-domain.error.log;
    client_max_body_size 1m;
    # Fail closed for private/unknown paths; only approved public routes may index.
    add_header X-Robots-Tag $jardines_domain_robots always;
    proxy_temp_path /var/lib/nginx/jardines-proxy 1 2;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Authenticate the browser origin BEFORE adapting this one public endpoint.
    # Never rewrite Origin globally or expose a private CRM API under this alias.
    location = /api/landing/registrations {
        if ($http_origin != "https://jardinesdelencanto.site") { return 403; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "https://jardines.2.24.111.40.sslip.io";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-CSRF-Token "";
        proxy_pass http://127.0.0.1:13400;
    }
    location ^~ /api/ { return 404; }
    location = /crm { return 302 https://jardines.2.24.111.40.sslip.io$request_uri; }
    location ^~ /crm/ { return 302 https://jardines.2.24.111.40.sslip.io$request_uri; }
    location = /login { return 302 https://jardines.2.24.111.40.sslip.io/login; }
    location / { proxy_pass http://127.0.0.1:13400; }
}
