# Source policy only. An operator must explicitly install outside release directories.
name: jardines-analytics

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  umami:
    <<: *runtime
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    user: "1001:1001"
    env_file: ${ANALYTICS_SECRETS_DIR:?Set ANALYTICS_SECRETS_DIR}/server.env
    environment:
      DISABLE_TELEMETRY: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      DISABLE_UPDATES: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      HOME: /tmp
    # COLLECT_API_ENDPOINT is deliberately unset: its startup updater writes public/script.js.
    networks: [app, analytics_data]
    tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid,nodev"]
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    depends_on:
      analytics-db: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 6s
      retries: 8
      start_period: 90s
  analytics-db:
    <<: *runtime
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: "70:70"
    env_file: ${ANALYTICS_SECRETS_DIR}/db.env
    environment:
      POSTGRES_DB: jardines_analytics
      POSTGRES_USER: jardines_analytics
    volumes: ["analytics_postgres:/var/lib/postgresql/data"]
    tmpfs: ["/tmp:size=32m,mode=1777,noexec,nosuid,nodev", "/var/run/postgresql:size=16m,uid=70,gid=70"]
    networks: [analytics_data]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U jardines_analytics -d jardines_analytics"]
      interval: 10s
      timeout: 5s
      retries: 8

networks:
  app:
    external: true
    name: jardines_app
  analytics_data:
    internal: true
volumes:
  analytics_postgres: {}
